name: Rust CI

on:
  push:
    branches: [ "*", "!main" ]
    paths-ignore:
      - '.github/workflows'
      - '**/*.md'
      - 'Dockerfile'
  pull_request:
    branches: [ "*" ]
    paths-ignore:
      - '.github/workflows'
      - '**/*.md'
      - 'Dockerfile'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
